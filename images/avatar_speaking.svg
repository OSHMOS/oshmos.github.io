<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <defs>
    <radialGradient id="gradSpeak" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FF62A5;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#A259FF;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Glow behind -->
  <circle cx="100" cy="130" r="100" fill="url(#gradSpeak)" />
  <g transform="translate(100, 150)">
    <!-- Body Outline/Base -->
    <path d="M -45 -10 L 45 -10 Q 55 -10 60 0 L 60 70 Q 60 80 50 80 L -50 80 Q -60 80 -60 70 L -60 0 Q -55 -10 -45 -10 Z" fill="#ffffff" filter="url(#shadow)" />
    <!-- Head/Screen -->
    <rect x="-65" y="-110" width="130" height="110" rx="35" fill="#fcfcfc" filter="url(#shadow)" stroke="#eaeaea" stroke-width="2"/>
    <rect x="-55" y="-100" width="110" height="90" rx="25" fill="#1e1e24" />
    
    <!-- Happy curve eyes -->
    <path d="M -28 -60 Q -20 -75 -12 -60" stroke="#14F1D9" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 12 -60 Q 20 -75 28 -60" stroke="#14F1D9" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <ellipse cx="-35" cy="-45" rx="8" ry="4" fill="#FF62A5" opacity="0.5"/>
    <ellipse cx="35" cy="-45" rx="8" ry="4" fill="#FF62A5" opacity="0.5"/>
    
    <!-- Open mouth speaking -->
    <path d="M -15 -35 Q 0 -20 15 -35 Z" fill="#14F1D9" />
  </g>
</svg>
