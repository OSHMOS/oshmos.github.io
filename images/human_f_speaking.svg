<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <defs>
    <radialGradient id="gradSpeakF" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FCA5A5" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowF" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.1" />
    </filter>
  </defs>
  <circle cx="100" cy="130" r="100" fill="url(#gradSpeakF)" />
  <g transform="translate(100, 150)">
    <!-- Body -->
    <path d="M -45 -10 L 45 -10 Q 60 -10 60 20 L 60 80 L -60 80 L -60 20 Q -60 -10 -45 -10 Z" fill="#F4F4F5" filter="url(#shadowF)" />
    <!-- Pink Shirt Accent -->
    <path d="M -30 -10 L 30 -10 L 0 50 Z" fill="#F472B6" opacity="0.4" />
    <!-- Neck -->
    <rect x="-12" y="-30" width="24" height="40" fill="#FFCBB3" rx="4"/>
    
    <!-- Back Hair -->
    <path d="M -45 -50 C -70 -50, -70 50, -60 70 Q -40 90 -35 40 L -35 -50 C -20 -120 20 -120 35 -50 L 35 40 Q 40 90 60 70 C 70 50, 70 -50, 45 -50 Z" fill="#4B3832" />
    
    <!-- Head -->
    <rect x="-42" y="-105" width="84" height="90" rx="36" fill="#FFE2D1" filter="url(#shadowF)" />
    
    <!-- Hair Top / Bangs -->
    <path d="M -45 -60 C -50 -125, -20 -130, 0 -125 C 20 -130, 50 -125, 45 -60 C 40 -80, 20 -100, 0 -95 C -20 -100, -40 -80, -45 -60 Z" fill="#4B3832" />
    <path d="M -42 -70 Q -20 -100 0 -85 Q 20 -100 42 -70 Q 35 -110 0 -105 Q -35 -110 -42 -70 Z" fill="#3C2A25" />
    
    <!-- Happy Eyes Path (with eyelashes) -->
    <path d="M -22 -55 Q -16 -63 -10 -55" stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 -55 Q 16 -63 22 -55" stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -24 -57 Q -26 -60 -28 -58" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 24 -57 Q 26 -60 28 -58" stroke="#374151" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Cheeks Soft -->
    <ellipse cx="-26" cy="-45" rx="6" ry="3" fill="#FDA4AF" opacity="0.6"/>
    <ellipse cx="26" cy="-45" rx="6" ry="3" fill="#FDA4AF" opacity="0.6"/>
    
    <!-- Speaking Mouth Open -->
    <path d="M -10 -35 Q 0 -25 10 -35 Q 0 -20 -10 -35 Z" fill="#374151" />
    <path d="M -4 -32 Q 0 -28 4 -32 Z" fill="#FCA5A5" />
  </g>
</svg>
